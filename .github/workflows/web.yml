name: Web app
# Keeps the web app (docs/app, served by GitHub Pages) the same as the desktop app's ui folder.
on:
  push:
    branches: [main]
    paths: ["ui/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy the app into docs/app
        run: |
          rm -rf docs/app
          mkdir -p docs/app
          cp -r ui/. docs/app/
          rm -f docs/app/island.html
      - name: Save the copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/app
          git diff --cached --quiet || (git commit -m "Update the web app from ui/" && git push)
