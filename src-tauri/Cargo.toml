[package]
name = "still-life"
version = "0.2.0"
description = "StillLife — every note, quietly in orbit."
authors = ["BellaCYC"]
edition = "2021"

[lib]
name = "still_life_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
