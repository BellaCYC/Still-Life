<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StillLife</title>
  <style>
    :root {
      --paper: #f5f5f4;
      --ink: #3a3833;
      --muted: #6e6a62;
      --lavender: #c9c1e6;
      --butter: #e6e3a8;
      --graphite: #8a8778;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      text-align: center;
      padding: 24px;
    }
    img {
      width: min(260px, 40vmin);
      height: auto;
      border-radius: 22%;
      box-shadow: 0 18px 40px rgba(60, 52, 44, 0.18);
    }
    h1 {
      margin: 12px 0 0;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(40px, 8vmin, 64px);
      letter-spacing: -0.01em;
    }
    p { margin: 0; font-size: 18px; color: var(--muted); }
    .dots { display: flex; gap: 8px; margin-top: 10px; }
    .dots span { width: 7px; height: 7px; border-radius: 50%; }
    small {
      margin-top: 18px;
      font-family: system-ui, sans-serif;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <img src="icon.png" alt="StillLife: a hand-drawn lavender Saturn">
    <h1>StillLife</h1>
    <p>Every note, quietly in orbit.</p>
    <div class="dots" aria-hidden="true">
      <span style="background: var(--lavender)"></span>
      <span style="background: var(--butter)"></span>
      <span style="background: var(--graphite)"></span>
    </div>
    <small>Early preview · version 0.1 · more features coming soon</small>
  </main>
</body>
</html>
